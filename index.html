<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>客訂系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root { --label-w: 7.5rem; }
    body { font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif; }
    .no-wrap-label { white-space: nowrap; display:block; }
    
    /* 表格外層滾動區 */
    .table-container {
      width: 100%;
      max-height: 500px; 
      overflow: auto;
      position: relative;
      -webkit-overflow-scrolling: touch;
      pointer-events: auto;
      border: 1px solid #e5e7eb;
      border-radius: 0.5rem;
      background-color: white;
    }
    
    /* 表格設定 */
    .table-container table { 
      width: 100%; 
      border-collapse: separate; 
      border-spacing: 0; 
    } 
    
    /* 內容儲存格樣式 */
    .table-container td {
      background-color: white;
      border-bottom: 1px solid #f3f4f6;
      padding: 0.75rem 1rem;
      font-size: 0.9rem;
      color: #374151;
      white-space: nowrap;
      text-align: center;
      vertical-align: middle;
    }

    /* 固定表頭樣式 */
    .table-container th {
      position: sticky;
      top: 0;
      z-index: 30;
      background-color: #f3f4f6;
      color: #111827;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 0.75rem 1rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 2px solid #e5e7eb;
      white-space: nowrap;
      text-align: center;
      vertical-align: middle;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }

    /* 滑鼠懸停行效果 */
    .table-container tr:hover td {
      background-color: #f9fafb;
    }
    
    .tag { display:inline-flex; align-items:center; padding:.25rem .75rem; margin:.25rem; font-size:.875rem; font-weight:500; background:#e5e7eb; color:#374151; border-radius:9999px; }
    .tag .remove { margin-left:.5rem; cursor:pointer; font-weight:bold; color:#9ca3af; }
    .tag .remove:hover { color:#374151; }
    
    .status-tag { display:inline-flex; align-items:center; gap:0.5rem; padding:0.25rem 0.75rem; border-radius:9999px; font-weight:600; font-size:0.875rem; }
    .status-paw { display:inline-flex; width:16px; height:16px; align-items:center; justify-content:center; flex-shrink:0; }
    .status-pending { background:#f3f4f6; color:#374151; }
    .status-purchase { background:#eef2ff; color:#3730a3; }
    .status-arrived { background:#f3e8ff; color:#6d28d9; }
    .status-missed { background:#fff7ed; color:#b45309; }
    .status-notified { background:#e0f2fe; color:#075985; }
    .status-closed { background:#dcfce7; color:#166534; }
    
    .loader { border:4px solid #f3f4f3; border-top:4px solid #3b82f6; border-radius:50%; width:40px; height:40px; animation:spin 1s linear infinite; margin:20px auto; }
    @keyframes spin { 0%{ transform:rotate(0deg);} 100%{ transform:rotate(360deg);} }
    
    .product-grid { display:grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap:1rem; }
    .product-field { display:flex; flex-direction:column; gap:0.5rem; }
    @media (max-width: 768px) { .product-grid { grid-template-columns: 1fr; } }
    @media (max-width:640px){ th, td { font-size: 12px; } }
    
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display:flex; align-items:center; justify-content:center; z-index:50; }
    .modal { background:white; border-radius:8px; max-width:980px; width:95%; max-height:90vh; overflow:auto; padding:20px; box-shadow:0 8px 24px rgba(0,0,0,0.2); }
    
    .btn { display:inline-flex; align-items:center; justify-content:center; gap:0.5rem; padding:0.5rem 0.75rem; border-radius:6px; font-weight:600; cursor: pointer; }
    .date-action { margin-left:0.5rem; }
    .info-box { background:#e6f0ff; color:#054a91; padding:0.75rem 1rem; border-radius:6px; }
    .phone-cell { font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
    td .inline-flex { height: 36px; align-items: center; justify-content:center; }
    
    header.site-header { display:flex; align-items:center; justify-content:center; gap:0.75rem; }
    header.site-header h1 { margin:0; display:flex; align-items:center; gap:0.5rem; }
    
    .topbar { background:transparent; display:flex; gap:1rem; align-items:center; padding:1rem; border-radius:8px; }
    .topbar .controls { display:flex; gap:0.75rem; align-items:center; }
    .topbar .hint { color:#6b7280; font-size:0.95rem; }
    .select-disabled { opacity:0.6; pointer-events:none; }
    
    /* 狀態書籤樣式 */
    .status-tabs { display:flex; gap:0.5rem; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
    .status-tab { padding:0.5rem 0.75rem; border-radius:999px; background:#f3f4f6; cursor:pointer; font-weight:600; color:#374151; border:1px solid transparent; user-select:none; transition: all 0.2s; }
    .status-tab.active { background:#4f46e5; color:white; border-color:#4338ca; box-shadow:0 2px 8px rgba(79,70,229,0.12); }
    .status-tab.all { background:#111827; color:white; }
    .status-tab:hover { opacity: 0.9; }
    .status-tabs-scroll { overflow:auto; white-space:nowrap; -webkit-overflow-scrolling:touch; padding-bottom:6px; position: relative; z-index: 20; }
    .status-tabs-scroll .status-tab { display:inline-block; white-space:normal; }

    /* 黑名單警示橫幅 */
    #blacklist-alert-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      background-color: #ef4444; color: white; padding: 1rem;
      text-align: center; font-weight: bold; font-size: 1.1rem;
      z-index: 9999; box-shadow: 0 -4px 6px -1px rgba(0, 0, 0, 0.1);
      display: none; animation: slideUp 0.3s ease-out;
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  </style>
</head>
<body class="bg-gray-100 p-4 md:p-8">

  <header class="text-center mb-6">
    <div class="max-w-7xl mx-auto site-header">
      <h1 class="text-4xl font-extrabold text-gray-800 tracking-wide">🐾 <span>客訂系統</span></h1>
    </div>
  </header>

  <div class="max-w-7xl mx-auto space-y-6">

    <!-- top controls -->
    <div class="bg-white p-4 rounded-lg shadow-sm">
      <div class="topbar">
        <div style="min-width:180px;font-weight:600;">店別選單</div>
        <div class="controls" style="flex:1;">
          <select id="storeSelect" class="rounded-md border-gray-300 shadow-sm p-2" style="min-width:260px;"></select>
          <label class="flex items-center gap-2">
            <input id="storeLockCheckbox" type="checkbox" />
            <span>店別鎖定</span>
          </label>
          <button id="refreshStoresBtn" class="btn bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700">重新整理分店</button>
        </div>
        <div class="hint">店別鎖定，選單為唯讀。</div>
      </div>
      <div id="top-message" class="mt-2 text-sm text-red-600 hidden"></div>
    </div>

    <!-- Form -->
    <form id="orderForm">
      <div class="lg:grid lg:grid-cols-12 lg:gap-8 items-stretch">
        <!-- Customer -->
        <div class="lg:col-span-6 mb-8 lg:mb-0">
          <div class="bg-white p-6 md:p-8 rounded-lg shadow-lg h-full flex flex-col">
            <h2 class="text-2xl font-bold text-gray-800 mb-4">顧客資料</h2>

            <fieldset class="border border-gray-300 p-4 rounded-lg mb-4">
              <legend class="text-lg font-semibold px-2 text-gray-700">基本資料</legend>
              <div class="mt-4 space-y-3">
                <div class="flex items-center gap-3">
                  <label for="customerID" class="no-wrap-label w-28 text-sm font-medium text-gray-700">客號</label>
                  <input id="customerID" name="客號" type="text" class="flex-1 rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500" />
                </div>
                <div class="flex items-center gap-3">
                  <label for="customerName" class="no-wrap-label w-28 text-sm font-medium text-gray-700">姓名</label>
                  <input id="customerName" name="姓名" type="text" class="flex-1 rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500" />
                </div>
                <!-- 電話輸入框與警告訊息 -->
                <div class="flex flex-col gap-1">
                  <div class="flex items-center gap-3 relative">
                    <label for="phone" class="no-wrap-label w-28 text-sm font-medium text-gray-700">連絡電話</label>
                    <input id="phone" name="連絡電話" type="tel" class="flex-1 rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 transition-colors" />
                  </div>
                  <!-- 警告文字容器 -->
                  <div id="phone-warning" class="text-red-600 text-sm font-bold pl-28 ml-3 hidden"></div>
                </div>
                <div class="flex items-center gap-3">
                  <label for="lineName" class="no-wrap-label w-28 text-sm font-medium text-gray-700">LINE名稱</label>
                  <input id="lineName" name="LINE名稱" type="text" class="flex-1 rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500" />
                </div>
                <div class="flex items-center gap-6">
                  <div class="flex items-center gap-3">
                    <label class="no-wrap-label text-sm font-medium text-gray-700">付清</label>
                    <input id="paid" name="paid" type="checkbox" value="是" class="h-5 w-5 text-indigo-600 focus:ring-indigo-500 border-gray-300 rounded" />
                  </div>
                  <div class="flex items-center gap-3">
                    <label class="no-wrap-label text-sm font-medium text-gray-700">固定/長期客訂</label>
                    <input id="longTerm" name="固定/長期客訂" type="checkbox" value="是" class="h-5 w-5 text-indigo-600 focus:ring-indigo-500 border-gray-300 rounded" />
                  </div>
                </div>
              </div>
            </fieldset>

            <fieldset class="border border-gray-300 p-4 rounded-lg mb-4">
              <legend class="text-lg font-semibold px-2 text-gray-700">備註</legend>
              <div class="mt-2">
                <label class="no-wrap-label w-full text-sm font-medium text-gray-700">說明</label>
                <textarea id="notes" name="備註" rows="4" class="w-full mt-2 rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500" placeholder="在此輸入備註 ..."></textarea>
              </div>
            </fieldset>
            <div class="mt-auto"></div>
          </div>
        </div>

        <!-- Product -->
        <div class="lg:col-span-6">
          <div class="bg-white p-6 md:p-8 rounded-lg shadow-lg h-full flex flex-col">
            <h2 class="text-2xl font-bold text-gray-800 mb-4">商品資料</h2>

            <fieldset class="border border-gray-300 p-4 rounded-lg mb-4">
              <legend class="text-lg font-semibold px-2 text-gray-700">客訂商品 A (必填)</legend>
              <div class="product-grid mt-3">
                <div class="product-field">
                  <label for="productAName" class="no-wrap-label text-sm font-medium text-gray-700">商品名稱</label>
                  <input id="productAName" name="客訂商品A" type="text" required class="mt-1 rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500" />
                </div>
                <div class="product-field">
                  <label for="productASpec" class="no-wrap-label text-sm font-medium text-gray-700">規格 / 重量</label>
                  <input id="productASpec" name="A商品規格" type="text" class="mt-1 rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500" />
                </div>
                <div class="product-field">
                  <label for="productAQty" class="no-wrap-label text-sm font-medium text-gray-700">數量</label>
                  <input id="productAQty" name="A數量" type="number" min="1" required class="mt-1 w-32 rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500" />
                </div>
              </div>
            </fieldset>

            <fieldset class="border border-gray-300 p-4 rounded-lg mb-4">
              <legend class="text-lg font-semibold px-2 text-gray-700">客訂商品 B (選填)</legend>
              <div class="product-grid mt-3">
                <div class="product-field">
                  <label for="productBName" class="no-wrap-label text-sm font-medium text-gray-700">商品名稱</label>
                  <input id="productBName" name="客訂商品B" type="text" class="mt-1 rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500" />
                </div>
                <div class="product-field">
                  <label for="productBSpec" class="no-wrap-label text-sm font-medium text-gray-700">規格 / 重量</label>
                  <input id="productBSpec" name="B商品規格" type="text" class="mt-1 rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500" />
                </div>
                <div class="product-field">
                  <label for="productBQty" class="no-wrap-label text-sm font-medium text-gray-700">數量</label>
                  <input id="productBQty" name="B數量" type="number" min="1" class="mt-1 w-32 rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500" />
                </div>
              </div>
            </fieldset>

            <div class="mt-auto"></div>
          </div>
        </div>
      </div>

      <div class="flex justify-center mt-4">
        <button type="submit" id="submitButton" class="bg-green-600 hover:bg-green-700 text-white font-semibold py-3 px-10 rounded-lg shadow">送出訂單</button>
      </div>
      <div id="message-box" class="hidden p-4 my-4 rounded-md max-w-3xl mx-auto"></div>

    </form>

    <!-- Data Query (bottom) -->
    <div>
      <div class="bg-white p-6 md:p-8 rounded-lg shadow-lg">
        <div class="flex items-center justify-between">
          <h2 class="text-4xl font-bold text-gray-800 mb-2">客訂資料查詢</h2>
          <div class="text-gray-600">搜尋、管理並執行操作（直接在表格內編輯或刪除）</div>
        </div>

        <div class="flex flex-col md:flex-row gap-4 mb-4">
          <div class="flex-1">
            <input id="searchInput" type="text" placeholder="搜尋客號、姓名、電話或商品名稱/規格..." class="block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500" />
          </div>
          <div class="flex gap-2">
            <button id="searchButton" type="button" class="bg-indigo-600 text-white px-4 py-2 rounded-md hover:bg-indigo-700">搜尋</button>
            <button id="refreshButton" type="button" class="flex justify-center items-center bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700">重新整理</button>
            <button id="clearOverdueBtn" type="button" class="flex justify-center items-center bg-orange-600 text-white px-4 py-2 rounded-md hover:bg-orange-700">清除逾期已取</button>
          </div>
        </div>

        <!-- 狀態書籤 -->
        <div id="statusTabsContainer" class="mb-3">
          <div class="status-tabs-scroll">
            <div id="statusTabs" class="status-tabs"></div>
          </div>
        </div>

        <div id="data-message-box" class="hidden p-4 mb-4 rounded-md"></div>

        <div id="dataContainer">
          <div id="dataLoader" class="loader hidden"></div>
          <p id="noDataText" class="text-center text-gray-500 hidden">尚未有客訂資料。</p>
          <div id="dataTableContainer" class="table-container hidden">
            <table class="min-w-full">
              <thead>
                <tr id="data-table-headers"></tr>
              </thead>
              <tbody id="data-table-body"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <!-- 固定/長期客訂資料查詢 -->
    <div>
      <div class="bg-white p-6 md:p-8 rounded-lg shadow-lg">
        <div class="flex items-center justify-between">
          <h2 class="text-4xl font-bold text-blue-800 mb-2">固定/長期客訂資料查詢</h2>
          <div class="text-gray-600">搜尋、管理並執行操作（直接在表格內編輯或刪除）</div>
        </div>

        <div class="flex flex-col md:flex-row gap-4 mb-4">
          <input id="longTerm_searchInput" type="text" placeholder="搜尋客號、姓名、電話或商品名稱/規格..." class="block w-full md:flex-1 rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500" />
          <div class="flex gap-2">
            <button id="longTerm_searchButton" type="button" class="bg-indigo-600 text-white px-4 py-2 rounded-md hover:bg-indigo-700">搜尋</button>
            <button id="longTerm_refreshButton" type="button" class="flex justify-center items-center bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700">重新整理</button>
          </div>
        </div>

        <!-- 狀態書籤 -->
        <div id="ltStatusTabsContainer" class="mb-3">
          <div class="status-tabs-scroll">
            <div id="ltStatusTabs" class="status-tabs"></div>
          </div>
        </div>

        <div id="longTerm_data-message-box" class="hidden p-4 mb-4 rounded-md"></div>

        <div id="longTerm_dataContainer">
          <div id="longTerm_dataLoader" class="loader hidden"></div>
          <p id="longTerm_noDataText" class="text-center text-gray-500 hidden">尚未有固定/長期客訂資料。</p>
          <div id="longTerm_dataTableContainer" class="table-container hidden">
            <table class="min-w-full">
              <thead>
                <tr id="longTerm_data-table-headers"></tr>
              </thead>
              <tbody id="longTerm_data-table-body"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <!-- 黑名單資料查詢 -->
    <div>
      <div class="bg-white p-6 md:p-8 rounded-lg shadow-lg border-2 border-red-200">
        <div class="flex items-center justify-between">
          <h2 class="text-4xl font-bold text-red-700 mb-2">黑名單資料查詢</h2>
          <div class="text-gray-600">黑名單資料總覽（全分店共用）</div>
        </div>

        <div class="flex flex-col md:flex-row gap-4 mb-4">
          <input id="blacklist_searchInput" type="text" placeholder="搜尋黑名單（電話、姓名、客號）..." class="block w-full md:flex-1 rounded-md border-gray-300 shadow-sm focus:border-red-500 focus:ring-red-500" />
          <div class="flex gap-2">
            <button id="blacklist_addButton" type="button" class="bg-red-600 text-white px-4 py-2 rounded-md hover:bg-red-700">新增黑名單</button>
            <button id="blacklist_searchButton" type="button" class="bg-gray-600 text-white px-4 py-2 rounded-md hover:bg-gray-700">搜尋</button>
            <button id="blacklist_refreshButton" type="button" class="flex justify-center items-center bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700">重新整理</button>
          </div>
        </div>

        <div id="blacklist_dataContainer">
          <div id="blacklist_dataLoader" class="loader hidden"></div>
          <p id="blacklist_noDataText" class="text-center text-gray-500 hidden">目前沒有黑名單資料。</p>
          <div id="blacklist_dataTableContainer" class="table-container hidden">
            <table class="min-w-full">
              <thead>
                <tr id="blacklist_data-table-headers"></tr>
              </thead>
              <tbody id="blacklist_data-table-body"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- 黑名單警示橫幅 -->
  <div id="blacklist-alert-bar"></div>

  <!-- Modals -->
  <div id="editModalBackdrop" class="modal-backdrop hidden">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="editModalTitle">
      <div class="flex items-center justify-between mb-4">
        <h3 id="editModalTitle" class="text-xl font-semibold">編輯訂單</h3>
        <button id="closeEditModal" class="btn" title="關閉">✕</button>
      </div>
      <form id="editForm" class="space-y-4">
        <input type="hidden" id="editRowIndex" name="row" />
        <input type="hidden" id="editLongTermHidden" /> 
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div><label class="block text-sm font-medium text-gray-700">客號</label><input id="editCustomerID" name="客號" class="mt-1 w-full rounded-md border-gray-300" /></div>
          <div><label class="block text-sm font-medium text-gray-700">姓名</label><input id="editCustomerName" name="姓名" class="mt-1 w-full rounded-md border-gray-300" /></div>
          <div><label class="block text-sm font-medium text-gray-700">連絡電話</label><input id="editPhone" name="連絡電話" class="mt-1 w-full rounded-md border-gray-300" /></div>
          <div><label class="block text-sm font-medium text-gray-700">客訂商品 A</label><input id="editProductAName" name="客訂商品A" class="mt-1 w-full rounded-md border-gray-300" /></div>
          <div><label class="block text-sm font-medium text-gray-700">A 商品規格</label><input id="editProductASpec" name="A商品規格" class="mt-1 w-full rounded-md border-gray-300" /></div>
          <div><label class="block text-sm font-medium text-gray-700">A 数量</label><input id="editProductAQty" name="A數量" type="number" min="0" class="mt-1 w-full rounded-md border-gray-300" /></div>
          <div><label class="block text-sm font-medium text-gray-700">客訂商品 B</label><input id="editProductBName" name="客訂商品B" class="mt-1 w-full rounded-md border-gray-300" /></div>

      const notifyDates = order['通知日期'];

      if (notifyDates && String(notifyDates).trim()) return { text:'已通知等取貨', class:'status-notified' };

      if (purchaseDate && String(purchaseDate).trim()) return { text:'已採購等到貨', class:'status-purchase' };
      return { text:'尚未處理', class:'status-pending' };
    }
    
    function pawSVG(){ return `<svg class="status-paw" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path fill="currentColor" d="M19.5 10.5c0 1.38-1.12 2.5-2.5 2.5s-2.5-1.12-2.5-2.5S15.62 8 17 8s2.5 1.12 2.5 2.5zM11.5 6c0 1.38-1.12 2.5-2.5 2.5S6.5 7.38 6.5 6 7.62 3.5 9 3.5 11.5 4.62 11.5 6zM6 13.5c0 1.38-1.12 2.5-2.5 2.5S1 14.88 1 13.5 2.12 11 3.5 11 6 12.12 6 13.5zM21 13.5c0 1.38-1.12 2.5-2.5 2.5S16 14.88 16 13.5 17.12 11 18.5 11 21 12.12 21 13.5zM12 12c-2 0-4 2-4 4 0 2 1.79 4 4 4s4-2 4-4c0-2-2-4-4-4z"/></svg>`; }

    function formatPhone(rawVal){
      if(rawVal===undefined || rawVal===null) return '';
      const s = String(rawVal).trim();
      if(s.startsWith('0')) return s;
      if(/^\d{9}$/.test(s)) return '0'+s;
      return s;
    }

    function isChecked(value) {
        if (typeof value === 'boolean') return value;
        if (typeof value === 'string') {
            const s = value.toLowerCase().trim();
            return s === '是' || s === 'true' || s === '1' || s === 'yes';
        }
        return false;
    }

    function formatFieldValueIfDate(fieldName, rawValue){
      if(!rawValue && rawValue !== 0) return '';
      const DATE_FIELDS = ['採購日期','到貨日期','取走日期','未接電話日期','通知日期','建立日期','creationDate','最後更新時間'];
      if(DATE_FIELDS.includes(fieldName)){
        const parts = String(rawValue).split(/[,;，\n]+/).map(s=>s.trim()).filter(Boolean).map(formatToYYYYMMDD);
        return parts.join(', ');
      }
      if(String(rawValue).includes('T') || /\d{4}-\d{2}-\d{2}/.test(String(rawValue))) return formatToYYYYMMDD(rawValue);
      return String(rawValue);
    }

    function formatToYYYYMMDD(singleVal){
      if(!singleVal && singleVal !== 0) return '';
      const s = String(singleVal).trim();
      const m1 = s.match(/^(\d{4})[\/\-](\d{2})[\/\-](\d{2})$/);
      if(m1) return `${m1[1]}/${m1[2]}/${m1[3]}`;
      const isoLike = s.match(/\d{4}-\d{2}-\d{2}/);
      if(isoLike){
        const parsed = new Date(s);
        if(!isNaN(parsed)){ return `${parsed.getFullYear()}/${pad(parsed.getMonth()+1)}/${pad(parsed.getDate())}`; }
        else return isoLike[0].replace(/-/g,'/');
      }
      const fallback = s.match(/(\d{4}).*?(\d{1,2}).*?(\d{1,2})/);
      if(fallback) return `${fallback[1]}/${pad(fallback[2])}/${pad(fallback[3])}`;
      return s;
    }

    function toDateOnly(val) {
      if (!val && val !== 0) return '';
      const s = String(val).trim();
      const m1 = s.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
      if (m1) {
        return `${m1[1]}-${String(m1[2]).padStart(2,'0')}-${String(m1[3]).padStart(2,'0')}`;
      }
      const m2 = s.match(/^(\d{4}-\d{2}-\d{2})/);
      if (m2) return m2[1];
      const parsed = new Date(s);
      if (!isNaN(parsed)) {
        return `${parsed.getFullYear()}-${pad(parsed.getMonth() + 1)}-${pad(parsed.getDate())}`;
      }
      return '';
    }
    function parseMultiDateStringToArray(dateString) {
        if (!dateString || typeof dateString !== 'string') return [];
        return dateString.split(/[,;，\s]+/)
                         .map(s => toDateOnly(s))
                         .filter(Boolean);
    }

    function getOrderTimestamp(order){
      if(order && order.creationDate){
        const t = Date.parse(order.creationDate);
        if(!isNaN(t)) return t;
      }
      const val = order && (order['最後更新時間'] || order['creationDate'] || order['建立日期'] || '');
      if(val){
        const iso = String(val).match(/\d{4}[-\/]\d{2}[-\/]\d{2}/);
        if(iso){
          const d = new Date(iso[0].replace(/-/g,'/'));
          if(!isNaN(d)) return d.getTime();
        }
        const d2 = new Date(String(val));
        if(!isNaN(d2)) return d2.getTime();
      }
      return 0;
    }

    async function deleteRow(rowValue, btnElement){
      const store = storeSelect.value || '';
      if(!rowValue){ console.error('找不到要刪除的列'); return; }
      
      // UI Feedback
      let originalText = '刪除';
      if(btnElement){
        originalText = btnElement.textContent;
        btnElement.disabled = true;
        btnElement.textContent = '刪除中...';
        btnElement.classList.add('opacity-50', 'cursor-not-allowed');
      }

      try {
        const fd = new FormData();
        fd.append('action', 'delete');
        fd.append('row', rowValue);
        if(store) fd.append('store', store);
        const resp = await fetch(SCRIPT_URL, { method:'POST', body: fd });
        const json = await resp.json();
        if(json && json.result === 'success'){
          showMessage('success','<strong>刪除成功：</strong> 已移除資料。');
          await fetchOrderData();
        } else {
          throw new Error((json && json.error) ? json.error : '伺服器回傳錯誤');
        }
      } catch(err){
        console.error('刪除失敗:', err);
        let msg = err.message;
        if(msg.includes('row 不正確')) msg += ' (資料可能已過期，請重新整理)';
        showMessage('error','<strong>刪除失敗：</strong>' + msg);
        
        // Revert button if failed
        if(btnElement){
          btnElement.disabled = false;
          btnElement.textContent = originalText;
          btnElement.classList.remove('opacity-50', 'cursor-not-allowed');
        }
      }
    }

    async function fetchStores(){
      showTopMessage('讀取分店清單中...');
      try{
        const resp = await fetch(`${SCRIPT_URL}?action=stores`);
        if(!resp.ok) throw new Error(resp.statusText || 'network error');
        const json = await resp.json();
        let stores = [];
        if(json && Array.isArray(json.stores)) stores = json.stores;
        else if(json && Array.isArray(json.rows)) stores = json.rows.map(r => r ? { code: r[Object.keys(r)[0]], name: r[Object.keys(r)[1]] || '' } : null).filter(Boolean);
        else if(json && Array.isArray(json.values)) json.values.forEach((r,i) => { if(i>0 && r.length) stores.push({code:r[0], name:r[1]||''}); });
        else if(json && json.result==='success' && Array.isArray(json.data)) stores = json.data;
        
        stores = stores.map(s => {
           if(typeof s === 'string') return { code: s, name: '' };
           if(s && s.code) return { code: String(s.code), name: String(s.name||'') };
           if(s && typeof s === 'object') { const vals = Object.values(s); return { code: String(vals[0]||''), name: String(vals[1]||'') }; }
           return null;
        }).filter(Boolean);

    async function fetchOrderData(){
      dataLoader.classList.remove('hidden');
      longTerm_dataLoader.classList.remove('hidden');
      dataTableContainer.classList.add('hidden');
      longTerm_dataTableContainer.classList.add('hidden');
      noDataText.classList.add('hidden'); 
      longTerm_noDataText.classList.add('hidden');
      hideDataMessage();
      hideDataMessage(true);

      const store = storeSelect.value || '';

      try{
        const url = store ? `${SCRIPT_URL}?store=${encodeURIComponent(store)}` : SCRIPT_URL;
        const resp = await fetch(url);
        if(!resp.ok) throw new Error(resp.statusText);
        const data = await resp.json();
        if(data.error) throw new Error(data.error);

        const allData = data.rows || data.values || data.data || [];
        tableHeadersOriginal = data.headers || data.columns || (data.values ? data.values[0] : []) || [];

        if(Array.isArray(data.values) && data.values.length>0 && (!tableHeadersOriginal || tableHeadersOriginal.length===0)){
          tableHeadersOriginal = data.values[0].map(h=>String(h||'').trim());
        }

        longTerm_tableHeadersOriginal = Array.isArray(tableHeadersOriginal) ? tableHeadersOriginal.slice() : [];

        let rows = [];
        if(Array.isArray(allData) && allData.length>0 && Array.isArray(allData[0])){
          const vals = allData;
          const headersRow = vals[0].map(h=>String(h||'').trim());
          for(let r=1;r<vals.length;r++){
            const rowArr = vals[r];
            const obj = {};
            headersRow.forEach((hh, idx)=> obj[hh] = rowArr[idx]);
            obj['__row'] = r+1;
            rows.push(obj);
          }
        } else {
          rows = allData.map(r => r);
        }

        // separate long term vs normal
        allOrders = [];
        allLongTermOrders = [];
        rows.forEach(order=>{
          if(isChecked(order['固定/長期客訂'])) allLongTermOrders.push(order);
          else allOrders.push(order);
        });

        // sort
        allOrders.sort((a,b)=>{
          const aClosed = (getOrderStatus(a).text === '已取貨');
          const bClosed = (getOrderStatus(b).text === '已取貨');
          if(aClosed !== bClosed) return aClosed ? 1 : -1;
          return getOrderTimestamp(b) - getOrderTimestamp(a);
        });
        allLongTermOrders.sort((a,b)=>{
          return getOrderTimestamp(b) - getOrderTimestamp(a);
        });

        // render tabs
        renderStatusTabs(statusTabsEl, currentStatusFilter, setMainStatusFilter);
        renderStatusTabs(ltStatusTabsEl, currentLTStatusFilter, setLTStatusFilter);

        // render headers first
        const displayHeaders = tableHeadersOriginal.map(h => headerNameMap[h] || h);
        renderTableHeaders(displayHeaders);

        const longDisplayHeaders = longTerm_tableHeadersOriginal.map(h => headerNameMap[h] || h);
        renderLongTermTableHeaders(longDisplayHeaders);

        // render data using filters
        filterAndDisplayData();
        filterAndDisplayLongTermData();

      }catch(err){
        console.error('讀取資料失敗:', err);
        const errMsg = '<strong>讀取資料失敗：</strong>' + err.message;
        showDataMessage('error', errMsg);
        showDataMessage('error', errMsg, true);
        noDataText.classList.remove('hidden'); noDataText.textContent = '讀取資料失敗。';
        longTerm_noDataText.classList.remove('hidden');
        longTerm_noDataText.textContent = '讀取資料失敗。';
      }finally{
        dataLoader.classList.add('hidden');
        longTerm_dataLoader.classList.add('hidden');
      }
    }

        try {
          if (allOrders.length === 0) { alert('目前沒有客訂資料。'); return; }
          
          const now = new Date();
          const ONE_DAY = 24 * 60 * 60 * 1000;
          
          // 找出符合條件的訂單
          const toDelete = allOrders.filter(order => {
            // 嘗試取得取走日期（容錯：嘗試兩種常見欄位名稱）
            const pickupDateStr = order['取走日期'] || order['取貨日期'];
            if (!pickupDateStr || !String(pickupDateStr).trim()) return false;
            
            // 解析日期 (多重日期只取第一個)
            const firstDate = parseMultiDateStringToArray(pickupDateStr)[0];
            if (!firstDate) return false;
            
            const pickupDate = new Date(firstDate);
            if (isNaN(pickupDate.getTime())) return false;
            
            // 計算天數差 (今天 - 取走日期)
            const diffTime = now - pickupDate;
            const diffDays = diffTime / ONE_DAY;
            
            return diffDays > 5;
          });

          if (toDelete.length === 0) {
            alert('沒有發現取貨超過 5 天的資料。');
            return;
          }

          // 取得目前選單的分店名稱，增加提示明確性

          if (!confirm(`確定刪除 ${storeName} 中，「取走日期」距離今天超過 5 天的資料嗎?`)) {

          // 開始刪除流程

          // 為了避免刪除後列號移位，必須依 row index 由大到小排序

          let successCount = 0;

      if(prev){ const found = Array.from(storeSelect.options).some(o=>o.value===prev); if(found) storeSelect.value = prev; }
      await updateStoreLockUI();
      fetchOrderData();
      fetchBlacklistData();
    });
    
    // Re-attach close modal listeners (important!)
    closeEditModal.addEventListener('click', closeModal);
    cancelEdit.addEventListener('click', (e)=>{ e.preventDefault(); closeModal(); });
    longTerm_closeEditModal.addEventListener('click', longTerm_closeModal);
    longTerm_cancelEdit.addEventListener('click', (e)=>{ e.preventDefault(); longTerm_closeModal(); });

    // modal logic
    function openEditModal(sheetRow){
      const order = allOrders.find(o => String(o['__row']) === String(sheetRow));
      if(!order){ console.error('找不到此筆資料'); return; }
      document.getElementById('editRowIndex').value = order['__row'];
      document.getElementById('editLongTermHidden').value = isChecked(order['固定/長期客訂']) ? '是' : '否';
      document.getElementById('editCustomerID').value = order['客號'] || order['Cust ID'] || '';
      document.getElementById('editCustomerName').value = order['姓名'] || '';
      document.getElementById('editPhone').value = formatPhone(order['連絡電話'] || '');

      document.getElementById('editProductASpec').value = order['A商品規格'] || '';
      document.getElementById('editProductAQty').value = order['A數量'] || '';
      document.getElementById('editProductBName').value = order['客訂商品B'] || '';
      document.getElementById('editProductBSpec').value = order['B商品規格'] || '';
      document.getElementById('editProductBQty').value = order['B數量'] || '';
      const paidVal = order['付清'] !== undefined ? order['付清'] : order['paid'];
      document.getElementById('editPaid').checked = isChecked(paidVal);
      document.getElementById('editPurchaseDate').value = toDateOnly(order['採購日期'] || '');
      document.getElementById('editArrivalDate').value = toDateOnly(order['到貨日期'] || '');
      document.getElementById('editPickupDate').value = toDateOnly(order['取走日期'] || '');
      document.getElementById('editStoreTransfer').value = order['分店調撥'] || '';
      document.getElementById('editNotes').value = order['備註'] || order['說明'] || '';
      try{
        const missed = parseMultiDateStringToArray(order['未接電話日期']);
        const notify = parseMultiDateStringToArray(order['通知日期']);
        editMissedCtrl.setItems(missed);
        editNotifyCtrl.setItems(notify);
      }catch(e){ console.warn(e); }
      editModalBackdrop.classList.remove('hidden');
    }
