<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>客訂系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root { --label-w: 7.5rem; }
    body { font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif; }
    .no-wrap-label { white-space: nowrap; display:block; }
    /* 表格外層滾動區（可調高度） */
    .table-container {
      width: 100%;
      max-height: 420px;   /* 若要更高/低可調整 */
      overflow: auto;
      position: relative;  /* 讓內部元素 z-index 有意義 */
      -webkit-overflow-scrolling: touch; /* 行動裝置平滑滾動 */
      /* 確保內部元素可點擊（避免被 overlay 影響） */
      pointer-events: auto;
    }
    /* 強制 table 內元素可以接收 pointer 事件（有些情況下父層或外來樣式會改變） */
    .table-container * { pointer-events: auto; }

    /* 確保表格寬度自適應，不會因 overflow 變形 */
    .table-container table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td { white-space: nowrap; text-align: center; vertical-align: middle !important; }
    .tag { display:inline-flex; align-items:center; padding:.25rem .75rem; margin:.25rem; font-size:.875rem; font-weight:500; background:#e5e7eb; color:#374151; border-radius:9999px; }
    .tag .remove { margin-left:.5rem; cursor:pointer; font-weight:bold; color:#9ca3af; }
    .tag .remove:hover { color:#374151; }
    .status-tag { display:inline-flex; align-items:center; gap:0.5rem; padding:0.25rem 0.75rem; border-radius:9999px; font-weight:600; font-size:0.875rem; }
    .status-paw { display:inline-flex; width:16px; height:16px; align-items:center; justify-content:center; flex-shrink:0; }
    .status-pending { background:#f3f4f6; color:#374151; }
    .status-purchase { background:#eef2ff; color:#3730a3; }
    .status-arrived { background:#f3e8ff; color:#6d28d9; }
    .status-missed { background:#fff7ed; color:#b45309; }
    .status-notified { background:#e0f2fe; color:#075985; }
    .status-closed { background:#dcfce7; color:#166534; }
    .loader { border:4px solid #f3f4f3; border-top:4px solid #3b82f6; border-radius:50%; width:40px; height:40px; animation:spin 1s linear infinite; margin:20px auto; }
    @keyframes spin { 0%{ transform:rotate(0deg);} 100%{ transform:rotate(360deg);} }
    .product-grid { display:grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap:1rem; }
    .product-field { display:flex; flex-direction:column; gap:0.5rem; }
    @media (max-width: 768px) { .product-grid { grid-template-columns: 1fr; } }
    @media (max-width:640px){ th, td { font-size: 12px; } }
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display:flex; align-items:center; justify-content:center; z-index:50; }
    .modal { background:white; border-radius:8px; max-width:980px; width:95%; max-height:90vh; overflow:auto; padding:20px; box-shadow:0 8px 24px rgba(0,0,0,0.2); }
    .btn { display:inline-flex; align-items:center; justify-content:center; gap:0.5rem; padding:0.5rem 0.75rem; border-radius:6px; font-weight:600; }
    .date-action { margin-left:0.5rem; }
    .info-box { background:#e6f0ff; color:#054a91; padding:0.75rem 1rem; border-radius:6px; }
    .phone-cell { font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
    /* 微調：讓按鈕在 td 內更直覺置中並有一致高度 */
    td .inline-flex { height: 36px; align-items: center; justify-content:center; }
    /* header center tweaks */
    header.site-header { display:flex; align-items:center; justify-content:center; gap:0.75rem; }
    header.site-header h1 { margin:0; display:flex; align-items:center; gap:0.5rem; }
    /* top control bar */
    .topbar { background:transparent; display:flex; gap:1rem; align-items:center; padding:1rem; border-radius:8px; }
    .topbar .controls { display:flex; gap:0.75rem; align-items:center; }
    .topbar .hint { color:#6b7280; font-size:0.95rem; }
    .select-disabled { opacity:0.6; pointer-events:none; }
    /* 確保表格按鈕層級足夠並顯示游標 */
    .table-container button,
    .table-container .inline-flex {
      position: relative;
      z-index: 5;
      cursor: pointer;
    }
    /* 若你有 modal/backdrop，保留其更高層級 */
    .modal-backdrop { z-index: 50; }
    .modal { z-index: 60; }
  </style>
</head>
<body class="bg-gray-100 p-4 md:p-8">

  <header class="text-center mb-6">
    <div class="max-w-7xl mx-auto site-header">
      <h1 class="text-4xl font-extrabold text-gray-800 tracking-wide">🐾 <span>客訂系統</span></h1>
    </div>
  </header>

  <div class="max-w-7xl mx-auto space-y-6">

    <!-- top controls: store select, lock, refresh -->
    <div class="bg-white p-4 rounded-lg shadow-sm">
      <div class="topbar">
        <div style="min-width:180px;font-weight:600;">店別選單</div>
        <div class="controls" style="flex:1;">
          <select id="storeSelect" class="rounded-md border-gray-300 shadow-sm p-2" style="min-width:260px;"></select>
          <label class="flex items-center gap-2">
            <input id="storeLockCheckbox" type="checkbox" />
            <span>店別鎖定</span>
          </label>
          <button id="refreshStoresBtn" class="btn bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700">重新整理分店</button>
        </div>
        <div class="hint">店別鎖定，選單為唯讀。</div>
      </div>
      <div id="top-message" class="mt-2 text-sm text-red-600 hidden"></div>
    </div>

    <!-- Form -->
    <form id="orderForm">
      <div class="lg:grid lg:grid-cols-12 lg:gap-8 items-stretch">
        <!-- Customer -->
        <div class="lg:col-span-6 mb-8 lg:mb-0">
          <div class="bg-white p-6 md:p-8 rounded-lg shadow-lg h-full flex flex-col">
            <h2 class="text-2xl font-bold text-gray-800 mb-4">顧客資料</h2>

            <fieldset class="border border-gray-300 p-4 rounded-lg mb-4">
              <legend class="text-lg font-semibold px-2 text-gray-700">基本資料</legend>
              <div class="mt-4 space-y-3">
                <div class="flex items-center gap-3">
                  <label for="customerID" class="no-wrap-label w-28 text-sm font-medium text-gray-700">客號</label>
                  <input id="customerID" name="客號" type="text" class="flex-1 rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500" />
                </div>
                <div class="flex items-center gap-3">
                  <label for="customerName" class="no-wrap-label w-28 text-sm font-medium text-gray-700">姓名</label>
                  <input id="customerName" name="姓名" type="text" class="flex-1 rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500" />
                </div>
                <div class="flex items-center gap-3">
                  <label for="phone" class="no-wrap-label w-28 text-sm font-medium text-gray-700">連絡電話</label>
                  <input id="phone" name="連絡電話" type="tel" class="flex-1 rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500" />
                </div>
                <div class="flex items-center gap-3">
                  <label for="lineName" class="no-wrap-label w-28 text-sm font-medium text-gray-700">LINE名稱</label>
                  <input id="lineName" name="LINE名稱" type="text" class="flex-1 rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500" />
                </div>
                <!-- 勾選區塊 -->
                <div class="flex items-center gap-6">
                  <div class="flex items-center gap-3">
                    <label class="no-wrap-label text-sm font-medium text-gray-700">付清</label>
                    <input id="paid" name="paid" type="checkbox" value="是" class="h-5 w-5 text-indigo-600 focus:ring-indigo-500 border-gray-300 rounded" />
                  </div>
                  <div class="flex items-center gap-3">
                    <label class="no-wrap-label text-sm font-medium text-gray-700">固定/長期客訂</label>
                    <input id="longTerm" name="固定/長期客訂" type="checkbox" value="是" class="h-5 w-5 text-indigo-600 focus:ring-indigo-500 border-gray-300 rounded" />
                  </div>
                </div>
              </div>
            </fieldset>

            <fieldset class="border border-gray-300 p-4 rounded-lg mb-4">
              <legend class="text-lg font-semibold px-2 text-gray-700">備註</legend>
              <div class="mt-2">
                <label class="no-wrap-label w-full text-sm font-medium text-gray-700">說明</label>
                <textarea id="notes" name="備註" rows="4" class="w-full mt-2 rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500" placeholder="在此輸入備註 ..."></textarea>
              </div>
            </fieldset>
            <div class="mt-auto"></div>
          </div>
        </div>

        <!-- Product -->
        <div class="lg:col-span-6">
          <div class="bg-white p-6 md:p-8 rounded-lg shadow-lg h-full flex flex-col">
            <h2 class="text-2xl font-bold text-gray-800 mb-4">商品資料</h2>

            <fieldset class="border border-gray-300 p-4 rounded-lg mb-4">
              <legend class="text-lg font-semibold px-2 text-gray-700">客訂商品 A (必填)</legend>
              <div class="product-grid mt-3">
                <div class="product-field">
                  <label for="productAName" class="no-wrap-label text-sm font-medium text-gray-700">商品名稱</label>
                  <input id="productAName" name="客訂商品A" type="text" required class="mt-1 rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500" />
                </div>
                <div class="product-field">
                  <label for="productASpec" class="no-wrap-label text-sm font-medium text-gray-700">規格 / 重量</label>
                  <input id="productASpec" name="A商品規格" type="text" class="mt-1 rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500" />
                </div>
                <div class="product-field">
                  <label for="productAQty" class="no-wrap-label text-sm font-medium text-gray-700">数量</label>
                  <input id="productAQty" name="A數量" type="number" min="1" required class="mt-1 w-32 rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500" />
                </div>
              </div>
            </fieldset>

            <fieldset class="border border-gray-300 p-4 rounded-lg mb-4">
              <legend class="text-lg font-semibold px-2 text-gray-700">客訂商品 B (選填)</legend>
              <div class="product-grid mt-3">
                <div class="product-field">
                  <label for="productBName" class="no-wrap-label text-sm font-medium text-gray-700">商品名稱</label>
                  <input id="productBName" name="客訂商品B" type="text" class="mt-1 rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500" />
                </div>
                <div class="product-field">
                  <label for="productBSpec" class="no-wrap-label text-sm font-medium text-gray-700">規格 / 重量</label>
                  <input id="productBSpec" name="B商品規格" type="text" class="mt-1 rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500" />
                </div>
                <div class="product-field">
                  <label for="productBQty" class="no-wrap-label text-sm font-medium text-gray-700">数量</label>
                  <input id="productBQty" name="B數量" type="number" min="1" class="mt-1 w-32 rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500" />
                </div>
              </div>
            </fieldset>

            <div class="mt-auto"></div>
          </div>
        </div>
      </div>

      <div class="flex justify-center mt-4">
        <button type="submit" id="submitButton" class="bg-green-600 hover:bg-green-700 text-white font-semibold py-3 px-10 rounded-lg shadow">送出訂單</button>
      </div>
      <!-- 訊息框移到按鈕下方 -->
      <div id="message-box" class="hidden p-4 my-4 rounded-md max-w-3xl mx-auto"></div>

    </form>

    <!-- Data Query (bottom) -->
    <div>
      <div class="bg-white p-6 md:p-8 rounded-lg shadow-lg">
        <div class="flex items-center justify-between">
          <h2 class="text-4xl font-bold text-gray-800 mb-2">客訂資料查詢</h2>
          <div class="text-gray-600">搜尋、管理並執行操作（直接在表格內編輯或刪除）</div>
        </div>

        <div class="flex flex-col md:flex-row gap-4 mb-4">
          <!-- 更新提示文字 -->
          <input id="searchInput" type="text" placeholder="搜尋客號、姓名、電話或商品名稱/規格..." class="block w-full md:flex-1 rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500" />
          <div class="flex gap-2">
            <button id="searchButton" class="bg-indigo-600 text-white px-4 py-2 rounded-md hover:bg-indigo-700">搜尋</button>
            <button id="refreshButton" class="flex justify-center items-center bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700">重新整理</button>
          </div>
        </div>

        <div id="data-message-box" class="hidden p-4 mb-4 rounded-md"></div>

        <div id="dataContainer">
          <div id="dataLoader" class="loader hidden"></div>
          <p id="noDataText" class="text-center text-gray-500 hidden">尚未有客訂資料。</p>
          <div id="dataTableContainer" class="table-container hidden">
            <table class="min-w-full divide-y divide-gray-200">
              <thead class="bg-gray-50 text-center">
                <tr id="data-table-headers"></tr>
              </thead>
              <tbody id="data-table-body" class="bg-white divide-y divide-gray-200 text-center"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <!-- 固定/長期客訂資料查詢 -->
    <div>
      <div class="bg-white p-6 md:p-8 rounded-lg shadow-lg">
        <div class="flex items-center justify-between">
          <h2 class="text-4xl font-bold text-blue-800 mb-2">固定/長期客訂資料查詢</h2>
          <div class="text-gray-600">搜尋、管理並執行操作（直接在表格內編輯或刪除）</div>
        </div>

        <div class="flex flex-col md:flex-row gap-4 mb-4">
          <input id="longTerm_searchInput" type="text" placeholder="搜尋客號、姓名、電話或商品名稱/規格..." class="block w-full md:flex-1 rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500" />
          <div class="flex gap-2">
            <button id="longTerm_searchButton" class="bg-indigo-600 text-white px-4 py-2 rounded-md hover:bg-indigo-700">搜尋</button>
            <button id="longTerm_refreshButton" class="flex justify-center items-center bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700">重新整理</button>
          </div>
        </div>

        <div id="longTerm_data-message-box" class="hidden p-4 mb-4 rounded-md"></div>

        <div id="longTerm_dataContainer">
          <div id="longTerm_dataLoader" class="loader hidden"></div>
          <p id="longTerm_noDataText" class="text-center text-gray-500 hidden">尚未有固定/長期客訂資料。</p>
          <div id="longTerm_dataTableContainer" class="table-container hidden">
            <table class="min-w-full divide-y divide-gray-200">
              <thead class="bg-gray-50 text-center">
                <tr id="longTerm_data-table-headers"></tr>
              </thead>
              <tbody id="longTerm_data-table-body" class="bg-white divide-y divide-gray-200 text-center"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- Edit Modal (一般客訂) -->
  <div id="editModalBackdrop" class="modal-backdrop hidden">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="editModalTitle">
      <div class="flex items-center justify-between mb-4">
        <h3 id="editModalTitle" class="text-xl font-semibold">編輯訂單</h3>
        <button id="closeEditModal" class="btn" title="關閉">✕</button>
      </div>

      <form id="editForm" class="space-y-4">
        <input type="hidden" id="editRowIndex" />
        <input type="hidden" id="editLongTermHidden" /> 

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700">姓名</label>
            <input id="editCustomerName" class="mt-1 w-full rounded-md border-gray-300" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700">連絡電話</label>
            <input id="editPhone" class="mt-1 w-full rounded-md border-gray-300" />
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700">客訂商品 A</label>
            <input id="editProductAName" class="mt-1 w-full rounded-md border-gray-300" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700">A 商品規格</label>
            <input id="editProductASpec" class="mt-1 w-full rounded-md border-gray-300" />
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700">A 数量</label>
            <input id="editProductAQty" type="number" min="0" class="mt-1 w-full rounded-md border-gray-300" />
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700">客訂商品 B</label>
            <input id="editProductBName" class="mt-1 w-full rounded-md border-gray-300" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700">B 商品規格</label>
            <input id="editProductBSpec" class="mt-1 w-full rounded-md border-gray-300" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700">B 数量</label>
            <input id="editProductBQty" type="number" min="0" class="mt-1 w-full rounded-md border-gray-300" />
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700">採購日期</label>
            <div class="flex items-center mt-1">
              <input id="editPurchaseDate" type="date" class="flex-1 rounded-md border-gray-300" />
              <button type="button" class="btn date-action bg-blue-600 text-white flex-shrink-0" data-target="editPurchaseDate">標記今天</button>
            </div>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700">到貨日期</label>
            <div class="flex items-center mt-1">
              <input id="editArrivalDate" type="date" class="flex-1 rounded-md border-gray-300" />
              <button type="button" class="btn date-action bg-blue-600 text-white flex-shrink-0" data-target="editArrivalDate">標記今天</button>
            </div>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700">取走日期</label>
            <div class="flex items-center mt-1">
              <input id="editPickupDate" type="date" class="flex-1 rounded-md border-gray-300" />
              <button type="button" class="btn date-action bg-blue-600 text-white flex-shrink-0" data-target="editPickupDate">標記今天</button>
            </div>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700">分店調撥</label>
            <input id="editStoreTransfer" class="mt-1 w-full rounded-md border-gray-300" />
          </div>
          
          <!-- 付清勾選 -->
          <div class="md:col-span-2 flex items-center gap-3">
            <label class="no-wrap-label text-sm font-medium text-gray-700">付清</label>
            <input id="editPaid" name="paid" type="checkbox" value="是" class="h-5 w-5 text-indigo-600 focus:ring-indigo-500 border-gray-300 rounded" />
          </div>

          <div class="md:col-span-2">
            <label class="block text-sm font-medium text-gray-700">未接電話日期（可多筆）</label>
            <div class="mt-1 flex gap-2">
              <input id="editMissedInput" type="date" class="rounded-md border-gray-300" />
              <button id="editAddMissed" type="button" class="btn bg-indigo-600 text-white">新增</button>
              <button id="editStampMissed" type="button" class="btn bg-blue-600 text-white">標記今天</button>
            </div>
            <div id="editMissedTags" class="mt-2"></div>
            <input type="hidden" id="editMissedHidden" />
          </div>

          <div class="md:col-span-2">
            <label class="block text-sm font-medium text-gray-700">通知日期（可多筆）</label>
            <div class="mt-1 flex gap-2">
              <input id="editNotifyInput" type="date" class="rounded-md border-gray-300" />
              <button id="editAddNotify" type="button" class="btn bg-indigo-600 text-white">新增</button>
              <button id="editStampNotify" type="button" class="btn bg-blue-600 text-white">標記今天</button>
            </div>
            <div id="editNotifyTags" class="mt-2"></div>
            <input type="hidden" id="editNotifyHidden" />
          </div>

          <div class="md:col-span-2">
            <label class="block text-sm font-medium text-gray-700">備註</label>
            <textarea id="editNotes" rows="3" class="mt-1 w-full rounded-md border-gray-300"></textarea>
          </div>
        </div>

        <div class="flex justify-end gap-3 pt-2">
          <button type="button" id="cancelEdit" class="btn" style="background:#f3f4f6;border-radius:6px;">取消</button>
          <button type="button" id="deleteEdit" class="btn border border-transparent whitespace-nowrap" style="background:#ef4444;color:white;border-radius:6px;">刪除</button>
          <button type="submit" id="saveEdit" class="btn" style="background:#047857;color:white;border-radius:6px;">儲存變更</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Edit Modal (固定/長期客訂) -->
  <div id="longTerm_editModalBackdrop" class="modal-backdrop hidden">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="longTerm_editModalTitle">
      <div class="flex items-center justify-between mb-4">
        <h3 id="longTerm_editModalTitle" class="text-xl font-semibold">編輯固定/長期訂單</h3>
        <button id="longTerm_closeEditModal" class="btn" title="關閉">✕</button>
      </div>

      <form id="longTerm_editForm" class="space-y-4">
        <input type="hidden" id="longTerm_editRowIndex" />
        <input type="hidden" id="longTerm_editLongTermHidden" />

    // ---------- store list & lock handling ----------
    async function fetchStores(){
      showTopMessage('讀取分店清單中...');
      try{
        const resp = await fetch(`${SCRIPT_URL}?action=stores`);
        if(!resp.ok) throw new Error(resp.statusText || 'network error');
        const json = await resp.json();

        let stores = [];
        if(json && Array.isArray(json.stores)) {
          stores = json.stores;
        } else if(json && Array.isArray(json.rows)) {
          stores = json.rows.map(r => {
            if(typeof r === 'object' && r !== null) {
              const keys = Object.keys(r);
              return { code: r[keys[0]], name: r[keys[1]] || '' };
            }
            return null;
          }).filter(Boolean);
        } else if(json && Array.isArray(json.values)) {
          const vals = json.values;
          for(let i=1;i<vals.length;i++){
            const row = vals[i];
            if(row && row.length>=1){
              stores.push({ code: row[0], name: (row[1]||'') });
            }
          }
        } else if(json && json.result==='success' && Array.isArray(json.data)) {
          stores = json.data;
        } else {
          if(Array.isArray(json)) stores = json;
          else throw new Error('後端回傳格式不符合預期');
        }

        stores = stores.map(s => {
          if(typeof s === 'string') {
            return { code: s, name: '' };
          }
          if(s && s.code && s.name !== undefined) return { code: String(s.code), name: String(s.name) };
          if(s && typeof s === 'object') {
            const vals = Object.values(s);
            return { code: String(vals[0] || ''), name: String(vals[1] || '') };
          }
          return null;
        }).filter(Boolean);

        populateStoreSelect(stores);
        showTopMessage('', false);
        return stores;
      }catch(err){
        console.error('fetchStores failed', err);
        showTopMessage('無法取得分店（後端錯誤或回傳格式非預期）', true);
        return [];
      }
    }

    function populateStoreSelect(stores){
      const prev = storeSelect.value || '';
      storeSelect.innerHTML = '';
      const opt = document.createElement('option');
      opt.value = '';
      opt.textContent = '-- 請選擇店別 --';
      storeSelect.appendChild(opt);

      stores.forEach(s => {
        const o = document.createElement('option');
        o.value = s.code || s[0] || '';
        const name = (s.name||'').trim();
        o.textContent = o.value + (name ? ` — ${name}` : '');
        storeSelect.appendChild(o);
      });

      if(prev){
        const found = Array.from(storeSelect.options).some(o => o.value === prev);
        if(found) storeSelect.value = prev;
      }
      if(!storeSelect.value && storeSelect.options.length === 2) {
        storeSelect.selectedIndex = 1;
      }
      updateStoreLockUI();
    }

        } else {

    async function getStoreLockValue(store){
      if(!store) return false;
      try{
        const resp = await fetch(`${SCRIPT_URL}?action=get_store_lock&store=${encodeURIComponent(store)}`);
        if(!resp.ok) throw new Error(resp.statusText);
        const json = await resp.json();
        if(json && json.result === 'success') {
          const locked = json.locked === '1' || json.locked === 1 || json.locked === true || json.locked === 'true';
          return locked;
        }
      }catch(err){
        console.warn('getStoreLockValue error', err);
      }
      return false;
    }

    async function setStoreLockValue(store, locked){
      if(!store) return;
      try{
        const fd = new FormData();
        fd.append('action','set_store_lock');
        fd.append('store', store);
        fd.append('locked', locked ? '1' : '0');
        const resp = await fetch(SCRIPT_URL, { method:'POST', body: fd });
        const json = await resp.json();
        return json && json.result === 'success';
      }catch(err){
        console.warn('setStoreLockValue error', err);
        return false;
      }
    }

    async function updateStoreLockUI(){
      const store = storeSelect.value;
      if(!store){
        storeLockCheckbox.checked = false;
        storeLockCheckbox.disabled = true;
        storeSelect.classList.remove('select-disabled');
        return;
      }
      storeLockCheckbox.disabled = false;
      try{
        const locked = await getStoreLockValue(store);
        storeLockCheckbox.checked = !!locked;
        if(locked){
          storeSelect.classList.add('select-disabled');
          storeSelect.disabled = true;
        } else {
          storeSelect.classList.remove('select-disabled');
          storeSelect.disabled = false;
        }
      }catch(e){
        console.warn(e);
      }
    }

    // ===== 以下為你原來的資料表 / 表單 / 編輯邏輯 =====

    function toDateOnly(val) {
      if (!val && val !== 0) return '';
      const s = String(val).trim();
      const m1 = s.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
      if (m1) {
        return `${m1[1]}-${String(m1[2]).padStart(2,'0')}-${String(m1[3]).padStart(2,'0')}`;
      }
      const m2 = s.match(/^(\d{4}-\d{2}-\d{2})/);
      if (m2) return m2[1];
      const parsed = new Date(s);
      if (!isNaN(parsed)) {
        return `${parsed.getFullYear()}-${pad(parsed.getMonth() + 1)}-${pad(parsed.getDate())}`;
      }
      return '';
    }
    function parseMultiDateStringToArray(dateString) {
        if (!dateString || typeof dateString !== 'string') return [];
        return dateString.split(/[,;，\s]+/)
                         .map(s => toDateOnly(s))
                         .filter(Boolean);
    }

    function pad2(n){ return String(n).padStart(2,'0'); }
    function formatToYYYYMMDD(singleVal){
      if(!singleVal && singleVal !== 0) return '';
      const s = String(singleVal).trim();
      const m1 = s.match(/^(\d{4})[\/\-](\d{2})[\/\-](\d{2})$/);
      if(m1) return `${m1[1]}/${m1[2]}/${m1[3]}`;
      const isoLike = s.match(/\d{4}-\d{2}-\d{2}/);
      if(isoLike){
        const parsed = new Date(s);
        if(!isNaN(parsed)){ return `${parsed.getFullYear()}/${pad2(parsed.getMonth()+1)}/${pad2(parsed.getDate())}`; }
        else return isoLike[0].replace(/-/g,'/');
      }
      const fallback = s.match(/(\d{4}).*?(\d{1,2}).*?(\d{1,2})/);
      if(fallback) return `${fallback[1]}/${pad2(fallback[2])}/${pad2(fallback[3])}`;
      return s;
    }

    function normalizeYesNo(val) {
      if (val === undefined || val === null) return '否';
      const s = String(val).trim().toLowerCase();
      if (!s) return '否';
      if (['是','true','1','yes','y','on','v','✔','checked','t'].indexOf(s) !== -1) return '是';
      if (['否','false','0','no','n','off','f'].indexOf(s) !== -1) return '否';
      if (s.indexOf('是') !== -1) return '是';
      if (s.indexOf('否') !== -1) return '否';
      return '否';
    }

    function isChecked(value) {
        if (typeof value === 'boolean') return value;
        if (typeof value === 'string') {
            const s = value.toLowerCase().trim();
            return s === '是' || s === 'true' || s === '1' || s === 'yes';
        }
        return false;
    }

    function formatPhone(rawVal){
      if(rawVal===undefined || rawVal===null) return '';
      const s = String(rawVal).trim();
      if(s.startsWith('0')) return s;
      if(/^\d{9}$/.test(s)) return '0'+s;
      return s;
    }

    function getOrderStatus(order){
      const purchaseDate = order['採購日期'];
      const arrivalDate = order['到貨日期'];
      const missedCallDates = order['未接電話日期'];
      const notifyDates = order['通知日期'];
      const pickupDate = order['取走日期'];
      if (pickupDate && String(pickupDate).trim()) return { text:'結案', class:'status-closed' };
      if (notifyDates && String(notifyDates).trim()) return { text:'已通知等取貨', class:'status-notified' };
      if (missedCallDates && String(missedCallDates).trim()) return { text:'已到貨未接電話', class:'status-missed' };
      if (arrivalDate && String(arrivalDate).trim()) return { text:'已到貨還未聯絡', class:'status-arrived' };
      if (purchaseDate && String(purchaseDate).trim()) return { text:'已採購等到貨', class:'status-purchase' };
      return { text:'尚未處理', class:'status-pending' };
    }

    const DATE_FIELDS = ['採購日期','到貨日期','取走日期','未接電話日期','通知日期','建立日期','creationDate','最後更新時間'];

    function formatFieldValueIfDate(fieldName, rawValue){
      if(!rawValue && rawValue !== 0) return '';
      if(DATE_FIELDS.includes(fieldName)){

    function getOrderTimestamp(order){
      if(order && order.creationDate){
        const t = Date.parse(order.creationDate);
        if(!isNaN(t)) return t;
      }
      const val = order && (order['最後更新時間'] || order['creationDate'] || order['建立日期'] || '');
      if(val){
        const iso = String(val).match(/\d{4}[-\/]\d{2}[-\/]\d{2}/);
        if(iso){
          const d = new Date(iso[0].replace(/-/g,'/'));
          if(!isNaN(d)) return d.getTime();
        }
        const d2 = new Date(String(val));
        if(!isNaN(d2)) return d2.getTime();
      }
      return 0;
    }

    // fetchOrderData - now includes store param and sets longTerm_tableHeadersOriginal
    async function fetchOrderData(){
      dataLoader.classList.remove('hidden');
      document.getElementById('longTerm_dataLoader').classList.remove('hidden');
      dataTableContainer.classList.add('hidden');
      document.getElementById('longTerm_dataTableContainer').classList.add('hidden');
      noDataText.classList.add('hidden'); 
      document.getElementById('longTerm_noDataText').classList.add('hidden');
      hideDataMessage();
      hideDataMessage(true);

      const store = storeSelect.value || '';

      try{
        const url = store ? `${SCRIPT_URL}?store=${encodeURIComponent(store)}` : SCRIPT_URL;
        const resp = await fetch(url);
        if(!resp.ok) throw new Error(resp.statusText);
        const data = await resp.json();
        if(data.error) throw new Error(data.error);

        const allData = data.rows || data.values || data.data || [];
        tableHeadersOriginal = data.headers || data.columns || (data.values ? data.values[0] : []) || [];

        // normalize headers if values provided as values[][] (first row headers)
        if(Array.isArray(data.values) && data.values.length>0 && (!tableHeadersOriginal || tableHeadersOriginal.length===0)){
          tableHeadersOriginal = data.values[0].map(h=>String(h||'').trim());
        }

        // ensure longTerm_tableHeadersOriginal is set (fix bug)
        longTerm_tableHeadersOriginal = Array.isArray(tableHeadersOriginal) ? tableHeadersOriginal.slice() : [];

        // if allData is values[][], convert to objects
        let rows = [];
        if(Array.isArray(allData) && allData.length>0 && Array.isArray(allData[0])){
          const vals = allData;
          const headersRow = vals[0].map(h=>String(h||'').trim());
          for(let r=1;r<vals.length;r++){
            const rowArr = vals[r];
            const obj = {};
            headersRow.forEach((hh, idx)=> obj[hh] = rowArr[idx]);
            // we set __row as actual sheet row index (1-based) => r+1
            obj['__row'] = r+1;
            rows.push(obj);
          }
        } else {
          rows = allData.map(r => r); // assume already objects
        }

        // separate long term vs normal
        allOrders = [];
        allLongTermOrders = [];
        rows.forEach(order=>{
          if(isChecked(order['固定/長期客訂'])) allLongTermOrders.push(order);
          else allOrders.push(order);
        });

        // sort
        allOrders.sort((a,b)=>{
          const aClosed = (getOrderStatus(a).text === '結案');
          const bClosed = (getOrderStatus(b).text === '結案');
          if(aClosed !== bClosed) return aClosed ? 1 : -1;
          return getOrderTimestamp(b) - getOrderTimestamp(a);
        });
        allLongTermOrders.sort((a,b)=>{
          const aClosed = (getOrderStatus(a).text === '結案');
          const bClosed = (getOrderStatus(b).text === '結案');
          if(aClosed !== bClosed) return aClosed ? 1 : -1;
          return getOrderTimestamp(b) - getOrderTimestamp(a);
        });

        // render
        const displayHeaders = tableHeadersOriginal.map(h => headerNameMap[h] || h);
        renderTableHeaders(displayHeaders);
        displayData(allOrders);

        const longDisplayHeaders = longTerm_tableHeadersOriginal.map(h => headerNameMap[h] || h);
        renderLongTermTableHeaders(longDisplayHeaders);
        displayLongTermData(allLongTermOrders);

      }catch(err){
        console.error('讀取資料失敗:', err);
        const errMsg = '<strong>讀取資料失敗：</strong>' + err.message;
        showDataMessage('error', errMsg);
        showDataMessage('error', errMsg, true);
        noDataText.classList.remove('hidden'); noDataText.textContent = '讀取資料失敗。';
        document.getElementById('longTerm_noDataText').classList.remove('hidden');
        document.getElementById('longTerm_noDataText').textContent = '讀取資料失敗。';
      }finally{
        dataLoader.classList.add('hidden');
        document.getElementById('longTerm_dataLoader').classList.add('hidden');
      }
    }

        '姓名': document.getElementById('longTerm_editCustomerName').value || '',
        '連絡電話': document.getElementById('longTerm_editPhone').value || '',
        '客訂商品A': document.getElementById('longTerm_editProductAName').value || '',
        'A商品規格': document.getElementById('longTerm_editProductASpec').value || '',
        'A數量': document.getElementById('longTerm_editProductAQty').value || '',
        '客訂商品B': document.getElementById('longTerm_editProductBName').value || '',
        'B商品規格': document.getElementById('longTerm_editProductBSpec').value || '',
        'B數量': document.getElementById('longTerm_editProductBQty').value || '',
        'paid': paidVal,
        '付清': paidVal,
        '固定/長期客訂': document.getElementById('longTerm_editLongTermHidden').value || '是',
        '採購日期': document.getElementById('longTerm_editPurchaseHidden').value || '',
        '到貨日期': document.getElementById('longTerm_editArrivalHidden').value || '',
        '取走日期': document.getElementById('longTerm_editPickupHidden').value || '',
        '分店調撥': document.getElementById('longTerm_editStoreTransfer').value || '',
        '未接電話日期': document.getElementById('longTerm_editMissedHidden').value || '',
        '通知日期': document.getElementById('longTerm_editNotifyHidden').value || '',
        '備註': document.getElementById('longTerm_editNotes').value || ''
      };
      try{
        document.getElementById('longTerm_saveEdit').disabled = true;
        const fd = new FormData();
        for(const k in payload) fd.append(k, payload[k]);
        if(store) fd.append('store', store);
        const resp = await fetch(SCRIPT_URL, { method:'POST', body: fd });
        const json = await resp.json();
        if(json && json.result === 'success'){ showMessage('success','<strong>更新成功</strong>：資料已更新。'); longTerm_closeModal(); fetchOrderData(); }
        else throw new Error((json && json.error) ? json.error : '伺服器回傳錯誤');
      }catch(err){
        console.error('更新失敗:', err); showMessage('error','<strong>更新失敗：</strong>'+ err.message);
      }finally{ document.getElementById('longTerm_saveEdit').disabled = false; }
    });

    // modal delete handlers
    deleteEditBtn && deleteEditBtn.addEventListener('click', async (e) => {
      e.preventDefault();
      const rowValue = document.getElementById('editRowIndex').value;
      if(!rowValue) { console.error('找不到此筆資料的索引，無法刪除。'); return; }
      try {
        deleteEditBtn.disabled = true;
        await deleteRow(rowValue);
      } catch(err) {
      } finally {
        deleteEditBtn.disabled = false;
        closeModal();
      }
    });

    document.getElementById('longTerm_deleteEdit').addEventListener('click', async (e) => {
      e.preventDefault();
      const rowValue = document.getElementById('longTerm_editRowIndex').value;
      if(!rowValue) { console.error('找不到此筆資料的索引，無法刪除。'); return; }
      try {
        document.getElementById('longTerm_deleteEdit').disabled = true;
        await deleteRow(rowValue);
      } catch(err) {
      } finally {
        document.getElementById('longTerm_deleteEdit').disabled = false;
        longTerm_closeModal();
      }
    });

    // search controls (same as before)
    function digitsOnly(s){ return String(s||'').replace(/\D/g,''); }
    function filterAndDisplayData(){
      const term = (searchInput.value || '').toLowerCase().trim();
      const searchDigits = digitsOnly(term);
      if(!term){ hideDataMessage(); displayData(allOrders); return; }
      const filtered = allOrders.filter(order=>{
        const id = String(order['客號'] || '').toLowerCase();
        const name = String(order['姓名'] || '').toLowerCase();
        const phone = String(order['連絡電話'] || '').toLowerCase();
        const status = getOrderStatus(order).text.toLowerCase();
        const phoneDigits = digitsOnly(order['連絡電話']);
        const matchByNumber = searchDigits && phoneDigits.includes(searchDigits);
        const productA = String(order['客訂商品A'] || '').toLowerCase();
        const specA = String(order['A商品規格'] || '').toLowerCase();
        const productB = String(order['客訂商品B'] || '').toLowerCase();
        const specB = String(order['B商品規格'] || '').toLowerCase();
        return id.includes(term) || name.includes(term) || phone.includes(term) || status.includes(term) || matchByNumber || productA.includes(term) || specA.includes(term) || productB.includes(term) || specB.includes(term);
      });
      if(filtered.length === 0){ displayData([]); showDataMessage('info', '找不到符合條件的資料。'); }
      else { hideDataMessage(); displayData(filtered); }
    }
    function filterAndDisplayLongTermData(){
      const term = (document.getElementById('longTerm_searchInput').value || '').toLowerCase().trim();
      const searchDigits = digitsOnly(term);
      if(!term){ hideDataMessage(true); displayLongTermData(allLongTermOrders); return; }
      const filtered = allLongTermOrders.filter(order=>{
        const id = String(order['客號'] || '').toLowerCase();
        const name = String(order['姓名'] || '').toLowerCase();
        const phone = String(order['連絡電話'] || '').toLowerCase();
        const status = getOrderStatus(order).text.toLowerCase();
        const phoneDigits = digitsOnly(order['連絡電話']);
        const matchByNumber = searchDigits && phoneDigits.includes(searchDigits);
        const productA = String(order['客訂商品A'] || '').toLowerCase();
        const specA = String(order['A商品規格'] || '').toLowerCase();
        const productB = String(order['客訂商品B'] || '').toLowerCase();
        const specB = String(order['B商品規格'] || '').toLowerCase();
        return id.includes(term) || name.includes(term) || phone.includes(term) || status.includes(term) || matchByNumber || productA.includes(term) || specA.includes(term) || productB.includes(term) || specB.includes(term);
      });
      if(filtered.length === 0){ displayLongTermData([]); showDataMessage('info', '找不到符合條件的資料。', true); }
      else { hideDataMessage(true); displayLongTermData(filtered); }
    }

    if(searchButton) searchButton.addEventListener('click', filterAndDisplayData);
    searchInput.addEventListener('keydown', (e)=>{ if(e.key === 'Enter'){ e.preventDefault(); filterAndDisplayData(); } });
    const longTerm_searchButton = document.getElementById('longTerm_searchButton');
    const longTerm_searchInput = document.getElementById('longTerm_searchInput');
    if(longTerm_searchButton) longTerm_searchButton.addEventListener('click', filterAndDisplayLongTermData);
    longTerm_searchInput.addEventListener('keydown', (e)=>{ if(e.key === 'Enter'){ e.preventDefault(); filterAndDisplayLongTermData(); } });

    // refresh main data (re-read current store)
    refreshButton.addEventListener('click', ()=>{ searchInput.value=''; hideDataMessage(); fetchOrderData(); });
    document.getElementById('longTerm_refreshButton').addEventListener('click', ()=>{ document.getElementById('longTerm_searchInput').value=''; hideDataMessage(true); fetchOrderData(); });

    // helper show/hide data messages
    function showDataMessage(type, html, isLongTerm=false){
      const box = isLongTerm ? document.getElementById('longTerm_data-message-box') : dataMessageBox;
      if(!box) return;
      box.innerHTML = html;
      box.className = 'p-4 mb-4 rounded-md';
      if(type === 'error') box.classList.add('bg-red-100','text-red-800');
      else if(type === 'info') box.classList.add('info-box');
      else box.classList.add('bg-gray-100','text-gray-800');
      box.classList.remove('hidden');
    }
    function hideDataMessage(isLongTerm=false){
      const box = isLongTerm ? document.getElementById('longTerm_data-message-box') : dataMessageBox;
      if(box) box.classList.add('hidden');
    }

    // --------- Global click listener for buttons inside tables ----------
    // Use a document-level listener so clicks are captured even when the table is re-rendered
    document.addEventListener('click', function(e){
      // find a button that has data-sheet-row attribute (either edit or delete)
      const btn = e.target.closest('button[data-sheet-row]');
      if(!btn) return;
      const row = btn.getAttribute('data-sheet-row');
      const text = (btn.textContent || btn.innerText || '').trim();

      if(!row) return;

      // 編輯
      if(/編輯|🖉/.test(text)){
        const rStr = String(row);
        let found = allOrders && allOrders.find(o => String(o['__row']) === rStr);
        if(found){
          openEditModal(found['__row']);
          return;
        }
        found = allLongTermOrders && allLongTermOrders.find(o => String(o['__row']) === rStr);
        if(found){
          openLongTermEditModal(found['__row']);
          return;
        }
        try{ openEditModal(rStr); }catch(err){ console.warn('無法開啟編輯 modal', err); }
        return;
      }

      // 刪除
      if(/刪除/.test(text)){
        const rStr = String(row);
        if(confirm('確定要刪除此筆資料嗎？')){
          deleteRow(rStr);
        }
        return;
      }
    });

    // end of script
  </script>
</body>
</html>
